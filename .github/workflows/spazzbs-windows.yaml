name: SPAZZbs Windows Build
run-name: SPAZZbs Windows build (${{ github.ref_name }})
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spazzbs-windows-${{ github.ref }}
  cancel-in-progress: true
env:
  SPAZZBS_BASE_VERSION: '33.0.0'
jobs:
  windows-build:
    name: Windows x64 🪟
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # Forks made with "master branch only" have no OBS version tags, and the
      # OBS build and packaging scripts need one. Tag locally on the runner.
      - name: Add Version Tag 🏷️
        run: |
          # Drop any fetched tags (like the release tag below) so the OBS
          # scripts always see a plain version number.
          git tag --list | ForEach-Object { git tag -d $_ | Out-Null }
          git tag "${env:SPAZZBS_BASE_VERSION}" HEAD
          git describe --tags --long

      - name: Build SPAZZbs 🧱
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package SPAZZbs 📀
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Stage Files 📂
        run: |
          $Zip = Get-ChildItem -Path "${{ github.workspace }}/build_x64" -Filter "obs-studio-*-windows-x64.zip" -File | Select-Object -First 1
          $Stage = "${{ github.workspace }}/spazzbs_stage"
          Expand-Archive -Path $Zip.FullName -DestinationPath $Stage -Force

          # If the zip has one top-level folder, use its contents
          $Top = Get-ChildItem -Path $Stage
          if ( $Top.Count -eq 1 -and $Top[0].PSIsContainer -and -not (Test-Path "$Stage/bin") ) {
            $Stage = $Top[0].FullName
          }
          if ( -not (Test-Path "$Stage/bin/64bit/SPAZZbs.exe") ) {
            Get-ChildItem -Path $Stage -Recurse -Filter *.exe | Select-Object -First 20 FullName
            throw "SPAZZbs.exe not found in package"
          }

          # One-click launcher for the portable zip
          Set-Content -Path "$Stage/Open SPAZZbs.cmd" -Encoding ascii -Value @(
            '@echo off',
            'start "" /D "%~dp0bin\64bit" "%~dp0bin\64bit\SPAZZbs.exe" %*'
          )

          # Zip with 7-Zip using plain Deflate so Windows' built-in zip
          # support opens it (no bogus password prompt).
          $Out = "${{ github.workspace }}/spazzbs_out"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          Push-Location $Stage
          7z a -tzip -mm=Deflate -mx=7 "$Out/SPAZZbs-portable-windows-x64.zip" *
          if ( $LASTEXITCODE -ne 0 ) { throw "Zipping failed" }
          Pop-Location
          Remove-Item "$Stage/Open SPAZZbs.cmd"

          "SPAZZBS_STAGE=$Stage" >> $env:GITHUB_ENV

      - name: Build Installer 💿
        run: |
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ( -not (Test-Path $Iscc) ) {
            choco install innosetup --no-progress -y
          }
          & $Iscc `
            "/DSourceDir=${env:SPAZZBS_STAGE}" `
            "/DOutputDir=${{ github.workspace }}\spazzbs_out" `
            "/DAppVersion=${env:SPAZZBS_BASE_VERSION}" `
            "${{ github.workspace }}\.github\spazzbs\SPAZZbs.iss"
          if ( $LASTEXITCODE -ne 0 ) { throw "Installer build failed" }

      # Plain downloads on the Releases page (no extra zip, no sign-in).
      - name: Publish Release 🚀
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = 'latest'
          $Notes = "Latest SPAZZbs build from commit ${{ github.sha }}.`n`n" +
            "- **SPAZZbs-Setup.exe**: installer with desktop and Start menu icons.`n" +
            "- **SPAZZbs-portable-windows-x64.zip**: no install; unzip and double-click Open SPAZZbs.cmd.`n`n" +
            "Windows may say it protected your PC because the files aren't code-signed: click More info, then Run anyway."
          gh release delete $Tag --yes --cleanup-tag 2>$null
          gh release create $Tag `
            "${{ github.workspace }}/spazzbs_out/SPAZZbs-Setup.exe" `
            "${{ github.workspace }}/spazzbs_out/SPAZZbs-portable-windows-x64.zip" `
            --target ${{ github.sha }} --title "SPAZZbs (latest build)" --notes $Notes --latest
          if ( $LASTEXITCODE -ne 0 ) { throw "Publishing the release failed" }

      # Test branches only; master builds go to the Releases page.
      - name: Upload Installer 📡
        if: github.ref_name != 'master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SPAZZbs-Setup
          path: ${{ github.workspace }}/spazzbs_out/SPAZZbs-Setup.exe

      - name: Upload Portable Zip 📡
        if: github.ref_name != 'master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SPAZZbs-portable-windows-x64
          path: ${{ github.workspace }}/spazzbs_out/SPAZZbs-portable-windows-x64.zip
